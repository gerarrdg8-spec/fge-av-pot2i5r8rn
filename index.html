<title>AvaluacioJugadorFGE</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Montserrat:wght@400;600;700;800&display=swap">

<style>
/* Colors de la Fundació GironaEst, presos del logotip de gironaest.cat:
   verd fosc #2AA537 · verd de marca #75B72B · verd clar #93C02C · gris #838280
   Sèries Q1/Q2/Q3 validades per a daltonisme en clar i en fosc. */
:root{
  --ground:#F6F8F4; --surface:#FFFFFF; --ink:#16241A; --ink-2:#48544B; --muted:#7A857C;
  --line:#DEE4DC; --line-2:#BAC4B8; --fila:#F1F4EE; --graella:#E5EBE2;
  --nit:#17301C; --verd-pregon:#1E7A2F; --verd:#75B72B; --verd-viu:#2AA537;
  --verd-clar:#93C02C; --verd-text:#3C7A18; --sobre-verd:#17301C;
  --q1:#4E8A26; --q2:#0F6CA8; --q3:#8C3A3A;
  --avis:#8A5A00; --avis-fons:#FBF3E2;
  --st-no:#B03A2E; --st-proces:#9A6B00; --st-si:#2E7D32;
  --ombra:0 1px 2px rgba(22,36,26,.06), 0 8px 28px rgba(22,36,26,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0C130E; --surface:#151E17; --ink:#E8EFE9; --ink-2:#B2C0B5; --muted:#87968A;
    --line:#26332A; --line-2:#394838; --fila:#1A251C; --graella:#222E25;
    --nit:#0A130C; --verd-pregon:#1B6A2A; --verd-text:#9FCB43;
    --q1:#6BA836; --q2:#3E8FCE; --q3:#C56666;
    --avis:#E7B24C; --avis-fons:#241D0E;
    --st-no:#E27A6D; --st-proces:#D9A441; --st-si:#6FBF63;
    --ombra:0 1px 2px rgba(0,0,0,.4), 0 10px 34px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ground:#0C130E; --surface:#151E17; --ink:#E8EFE9; --ink-2:#B2C0B5; --muted:#87968A;
  --line:#26332A; --line-2:#394838; --fila:#1A251C; --graella:#222E25;
  --nit:#0A130C; --verd-pregon:#1B6A2A; --verd-text:#9FCB43;
  --q1:#6BA836; --q2:#3E8FCE; --q3:#C56666;
  --avis:#E7B24C; --avis-fons:#241D0E;
  --st-no:#E27A6D; --st-proces:#D9A441; --st-si:#6FBF63;
  --ombra:0 1px 2px rgba(0,0,0,.4), 0 10px 34px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:"Montserrat","Archivo",sans-serif;text-wrap:balance}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--verd-clar);outline-offset:2px}

.barra{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 22px;
  background:var(--nit);color:#fff;border-bottom:3px solid var(--verd)}
.barra .marca{font-family:"Montserrat",sans-serif;font-weight:800;letter-spacing:.14em;font-size:13px;text-transform:uppercase}
.barra .sep{width:1px;height:18px;background:rgba(255,255,255,.24)}
.barra .temp{font-size:12.5px;letter-spacing:.1em;color:rgba(255,255,255,.72);text-transform:uppercase}
.barra nav{margin-left:auto;display:flex;gap:8px}
.barra nav a{text-decoration:none;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
  padding:7px 13px;border-radius:2px;color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.2)}
.barra nav a[aria-current="page"]{background:var(--verd-clar);color:var(--nit);border-color:var(--verd-clar)}
.barra nav a:hover{border-color:var(--verd-clar);color:#fff}
.barra nav a[aria-current="page"]:hover{color:var(--nit)}

.wrap{max-width:1340px;margin:0 auto;padding:26px 22px 80px}

.boto{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font:inherit;font-size:12.5px;
  font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:9px 16px;border-radius:2px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);text-decoration:none}
.boto:hover{border-color:var(--verd-viu);color:var(--verd-text)}
.boto.principal{background:var(--verd-pregon);border-color:var(--verd-pregon);color:#fff}
.boto.principal:hover{background:var(--verd-viu);border-color:var(--verd-viu);color:#fff}
.eines{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 20px}
.eines .nota{font-size:12.5px;color:var(--muted)}

/* --- capçalera de l'avaluació --- */
.cap-quadre h1{font-size:clamp(26px,3.4vw,38px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.cap-quadre p{margin:6px 0 0;color:var(--ink-2);max-width:66ch;font-size:14.5px}

/* --- selector de jugadors --- */
.jugadors{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0 8px}
.jugadors button{font:inherit;font-size:12px;font-weight:600;letter-spacing:.04em;cursor:pointer;
  padding:7px 12px;border-radius:2px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.jugadors button:hover{border-color:var(--verd-viu);color:var(--ink)}
.jugadors button[aria-pressed="true"]{background:var(--verd-pregon);border-color:var(--verd-pregon);color:#fff}
.jugadors button .n{opacity:.65;margin-right:6px}

.fitxa-jug{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-left:4px solid var(--verd-clar);border-radius:3px;
  padding:14px 18px;margin-bottom:22px;box-shadow:var(--ombra)}
.fitxa-jug input.nom{font:inherit;font-family:"Montserrat",sans-serif;font-weight:800;font-size:22px;
  letter-spacing:-.02em;border:0;border-bottom:1px dashed var(--line-2);background:transparent;
  color:inherit;padding:2px 4px;min-width:240px;flex:1 1 240px}
.fitxa-jug input.nom::placeholder{color:var(--muted);font-weight:600}
.fitxa-jug .anar{margin-left:auto}

/* --- blocs --- */
.bloc{margin:0 0 34px}
.bloc > h2{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--verd-text);
  font-weight:700;padding-bottom:8px;border-bottom:2px solid var(--verd-clar);display:inline-block;margin-bottom:14px}
.bloc > h2 .cua{color:var(--muted);letter-spacing:.1em;margin-left:10px;font-weight:600}

.marc{background:var(--surface);border:1px solid var(--line);border-radius:3px;
  box-shadow:var(--ombra);overflow-x:auto}
table.r{border-collapse:separate;border-spacing:0;width:100%;min-width:1080px;font-size:12.5px}
table.r th,table.r td{border-right:1px solid var(--graella);border-bottom:1px solid var(--graella);
  padding:7px 10px;vertical-align:top;text-align:left}
table.r thead th{position:sticky;top:0;z-index:3;background:var(--verd-pregon);color:#fff;
  font-family:"Montserrat",sans-serif;font-weight:700;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;vertical-align:middle;border-right-color:rgba(255,255,255,.18)}
table.r thead th.niv{background:var(--nit)}
table.r thead th small{display:block;font-weight:500;letter-spacing:.02em;text-transform:none;
  font-size:9.5px;opacity:.72;margin-top:2px}
table.r td.qual{background:var(--fila);font-weight:600;width:170px;min-width:170px;color:var(--ink)}
table.r td.qual span{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:2px}
table.r td.niv{width:19%;min-width:150px;color:var(--ink-2);font-size:11.5px;line-height:1.42}
table.r td.q{width:58px;min-width:58px;padding:0;text-align:center;background:var(--verd-pregon)}
table.r td.o{width:150px;min-width:150px;padding:0}

select.p{-webkit-appearance:none;appearance:none;font:inherit;width:100%;height:34px;border:0;
  background:transparent;color:#fff;font-weight:700;font-size:13px;text-align:center;
  text-align-last:center;cursor:pointer}
select.p:hover{background:color-mix(in srgb,#fff 12%,transparent)}
select.p option{color:#16241A;background:#fff;font-weight:600}
select.p.buida{color:rgba(255,255,255,.45)}
select.p:focus{outline:2px solid var(--verd-clar);outline-offset:-2px}
input.o{font:inherit;width:100%;height:34px;border:0;background:transparent;color:var(--ink-2);
  font-size:11.5px;padding:0 9px}
input.o:focus{outline:2px solid var(--verd-clar);outline-offset:-2px}
input.o::placeholder{color:transparent}
input.o:hover::placeholder{color:var(--muted)}

/* formalitat */
.formalitat{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.pct{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:12px 14px;
  box-shadow:var(--ombra);min-width:132px}
.pct label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pct input{font:inherit;font-family:"Montserrat",sans-serif;font-weight:700;font-size:20px;width:74px;
  border:0;border-bottom:1px dashed var(--line-2);background:transparent;color:inherit;padding:2px 0;
  -moz-appearance:textfield}
.pct input::-webkit-outer-spin-button,.pct input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pct .u{color:var(--muted);font-weight:600}
.pct.total{background:var(--verd-pregon);border-color:var(--verd-pregon);color:#fff}
.pct.total label{color:rgba(255,255,255,.75)}
.pct.total .v{font-family:"Montserrat",sans-serif;font-weight:800;font-size:24px}

/* resum trimestral */
.resum{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.resum-c{border:1px solid var(--line);border-top:3px solid var(--verd-clar);border-radius:2px;
  padding:12px 14px;background:var(--surface);box-shadow:var(--ombra)}
.resum-c .re{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
.resum-c .rn{font-family:"Montserrat",sans-serif;font-weight:800;font-size:26px;line-height:1.1;
  font-variant-numeric:tabular-nums;margin-top:3px}
.resum-c .rq{display:flex;gap:10px;margin-top:6px;font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.resum-c .rq i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:0}

.llegenda{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 12px;font-size:12px;color:var(--ink-2)}
.llegenda i{width:11px;height:11px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:-1px}
.llegenda svg{vertical-align:-2px;margin-right:5px}

/* ---------- INFORME ---------- */
.full{background:var(--surface);border:1px solid var(--line);border-radius:3px;box-shadow:var(--ombra);
  display:grid;grid-template-columns:64px minmax(0,1fr);overflow:hidden}
.full + .full{margin-top:26px}
.banda{background:var(--verd-pregon);color:#fff;display:flex;align-items:center;justify-content:center}
.banda span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:"Montserrat",sans-serif;
  font-weight:800;font-size:18px;letter-spacing:.26em;text-transform:uppercase;white-space:nowrap}
.cos{padding:30px clamp(20px,4vw,46px) 34px;min-width:0}
.titol-informe{font-family:"Montserrat",sans-serif;font-weight:800;text-align:center;
  font-size:clamp(21px,3.5vw,34px);line-height:1.12;letter-spacing:-.015em;
  padding-bottom:16px;border-bottom:2px solid var(--nit)}
.titol-informe small{display:block;font-size:.44em;font-weight:600;letter-spacing:.22em;
  color:var(--verd-text);margin-top:7px;text-transform:uppercase}
.fila-seccio{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  margin-top:18px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.etiqueta-seccio{font-family:"Montserrat",sans-serif;font-weight:800;font-size:13px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--verd-text)}
.programa select{font:inherit;font-family:"Montserrat",sans-serif;font-weight:700;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--sobre-verd);background:var(--verd-clar);
  border:0;border-radius:2px;padding:5px 10px;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:center}
.programa select option{background:#fff;color:var(--ink);letter-spacing:0}
.qui{font-family:"Montserrat",sans-serif;font-weight:700;font-size:13px;color:var(--muted)}

.identitat{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:20px;align-items:center;margin-top:22px}
@media (max-width:760px){.identitat{grid-template-columns:1fr}}
.foto{width:92px;height:92px;border:1px solid var(--line-2);border-radius:2px;background:var(--fila);
  display:flex;align-items:center;justify-content:center;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);text-align:center;padding:6px}
.identitat h2{font-family:"Montserrat",sans-serif;font-size:clamp(25px,4.2vw,42px);font-weight:800;
  letter-spacing:-.03em;line-height:1.02}
.identitat h2 .buit{color:var(--muted)}
.fitxa{display:flex;flex-direction:column;gap:4px;text-align:right;font-size:13px}
.fitxa .l{display:flex;gap:8px;justify-content:flex-end;align-items:baseline;flex-wrap:wrap}
.fitxa .l b{font-family:"Montserrat",sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
.fitxa input{font:inherit;font-family:"Montserrat",sans-serif;font-weight:700;border:0;
  border-bottom:1px dashed var(--line-2);background:transparent;color:inherit;text-align:right;
  padding:1px 2px;min-width:36px}
.fitxa input:hover{border-bottom-color:var(--verd-viu)}
.fitxa input::placeholder{color:var(--muted);font-weight:500}
.fitxa .mit{font-family:"Montserrat",sans-serif;font-weight:700}

.seccio{margin-top:30px}
.seccio > h3{font-family:"Montserrat",sans-serif;font-weight:800;font-size:13px;letter-spacing:.2em;
  text-transform:uppercase;padding-bottom:7px;border-bottom:2px solid var(--verd-clar);display:inline-block}
.seccio.centrat{text-align:center}
.seccio.centrat > h3{border-bottom-color:var(--nit)}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:28px;margin-top:18px}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:26px;margin-top:18px}
.sub{font-family:"Montserrat",sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.16em;
  text-transform:uppercase;text-align:center;margin:0 0 10px}
.sub em{display:block;font-style:normal;font-size:10px;letter-spacing:.1em;color:var(--muted);
  font-weight:600;margin-top:2px}

/* barres agrupades per trimestre */
.grup{display:flex;flex-direction:column;gap:9px}
.grup-fila{font-size:12px}
.grup-fila .et{display:block;color:var(--ink-2);margin-bottom:3px}
.pistes{display:flex;flex-direction:column;gap:2px}
.pista{position:relative;height:9px;background:var(--graella);border-radius:2px}
.pista .fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 3px 3px 0}
.pista .tic{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--surface);opacity:.7}
.pista .vq{position:absolute;right:-22px;top:-3px;font-size:10px;font-weight:700;
  font-variant-numeric:tabular-nums;font-family:"Montserrat",sans-serif}
.grup-fila .pistes{padding-right:24px}

.camp-text{border:1px dashed var(--line-2);border-radius:2px;padding:11px 13px;min-height:70px;
  font-size:13.5px;line-height:1.6;color:var(--ink-2);text-align:left;white-space:pre-wrap}
.camp-text:hover{border-color:var(--verd-viu)}
.camp-text:focus{outline:2px solid var(--verd-clar);outline-offset:-1px;border-style:solid}
.camp-text.gran{min-height:120px;font-size:14.5px;max-width:78ch;margin:0 auto}
.camp-text.mitja{min-height:82px;max-width:80ch;margin:0 auto}
.camp-text:empty::before{content:attr(data-ph);color:var(--muted);font-style:italic}

table.detall{width:100%;border-collapse:collapse;font-size:12px}
table.detall caption{text-align:left;font-family:"Montserrat",sans-serif;font-weight:700;font-size:10.5px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink);padding:14px 0 6px}
table.detall th,table.detall td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left}
table.detall thead th{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
table.detall td.n,table.detall th.n{text-align:center;width:44px;font-variant-numeric:tabular-nums;font-weight:600}
table.detall tr.tot td{border-bottom:2px solid var(--nit);font-weight:700;background:var(--fila)}
.taules{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 32px}

.peu{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:20px;
  flex-wrap:wrap;justify-content:space-between;font-size:11px;color:var(--muted)}
.tornar{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.1em;
  text-transform:uppercase;font-weight:600;color:var(--ink-2);text-decoration:none}
.tornar:hover{color:var(--ink)}
.cap-eines{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:16px}
.nota-pag{font-size:12px;color:var(--muted)}

.plafo{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--verd-clar);
  border-radius:3px;padding:18px 20px;margin:0 0 20px;box-shadow:var(--ombra)}
.plafo-t{font-family:"Montserrat",sans-serif;font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.plafo-p{margin:6px 0 12px;font-size:14px;color:var(--ink-2);max-width:72ch}
.plafo textarea{width:100%;height:120px;resize:vertical;font-family:ui-monospace,"SF Mono",Menlo,monospace;
  font-size:11.5px;line-height:1.45;padding:10px 12px;border:1px solid var(--line-2);border-radius:3px;
  background:var(--fila);color:var(--ink)}
.plafo-b{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}

.tip{position:fixed;pointer-events:none;z-index:50;background:var(--nit);color:#fff;padding:6px 9px;
  border-radius:3px;font-size:11.5px;line-height:1.35;box-shadow:0 6px 20px rgba(0,0,0,.3);
  opacity:0;transition:opacity .12s;max-width:280px}
.tip b{font-family:"Montserrat",sans-serif}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- PÀGINA D'ENTRADA ---------- */
.portada{min-height:calc(100vh - 190px);display:flex;align-items:center;justify-content:center;padding:20px 0}
.porta{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--verd-clar);
  border-radius:4px;box-shadow:var(--ombra);padding:38px clamp(24px,5vw,44px);width:100%;max-width:460px}
.porta .marca-p{font-family:"Montserrat",sans-serif;font-weight:800;letter-spacing:.2em;font-size:11px;
  text-transform:uppercase;color:var(--verd-text);text-align:center}
.porta h1{font-size:clamp(24px,4vw,32px);font-weight:800;letter-spacing:-.02em;text-align:center;margin-top:8px}
.porta .peu-p{text-align:center;color:var(--muted);font-size:13.5px;margin-top:8px}
.porta form{display:flex;flex-direction:column;gap:18px;margin-top:28px}
.porta .c{display:flex;flex-direction:column;gap:6px}
.porta label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.porta select,.porta input{font:inherit;font-family:"Montserrat",sans-serif;font-weight:700;font-size:17px;
  padding:12px 14px;border:1px solid var(--line-2);border-radius:3px;background:var(--surface);
  color:var(--ink);width:100%}
.porta select{-webkit-appearance:none;appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 20px) 22px,calc(100% - 14px) 22px;background-size:6px 6px;background-repeat:no-repeat}
.porta select:focus,.porta input:focus{border-color:var(--verd-viu);outline:2px solid var(--verd-clar);outline-offset:-1px}
.porta .entrar{font:inherit;font-family:"Montserrat",sans-serif;font-weight:800;font-size:14px;

.porta .entrar:hover{background:var(--verd-viu)}
.porta .entrar:disabled{background:var(--line-2);cursor:not-allowed}

/* ---------- REGISTRE DIARI ---------- */
.cap-registre{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--verd-clar);
  border-radius:3px;padding:16px 20px;box-shadow:var(--ombra);margin-bottom:20px}
.cap-registre .qui-r{font-family:"Montserrat",sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em}
.cap-registre .quan{font-size:13px;color:var(--muted);margin-top:2px}
.reg-marc{background:var(--surface);border:1px solid var(--line);border-radius:3px;
  box-shadow:var(--ombra);overflow-x:auto}
table.reg{border-collapse:separate;border-spacing:0;width:100%;min-width:900px;font-size:12.5px}
table.reg th,table.reg td{border-right:1px solid var(--graella);border-bottom:1px solid var(--graella);
  padding:0;text-align:center}
table.reg thead th{background:var(--nit);color:#fff;font-family:"Montserrat",sans-serif;font-weight:700;
  font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:9px 5px;
  border-right-color:rgba(255,255,255,.16);vertical-align:middle;line-height:1.25}
table.reg thead th:first-child{text-align:left;padding-left:14px}
table.reg td.jug-r{text-align:left;padding:8px 14px;background:var(--fila);min-width:190px;
  font-weight:600;white-space:nowrap}
table.reg td.jug-r .d{font-family:"Montserrat",sans-serif;font-weight:800;color:var(--muted);
  display:inline-block;width:24px;font-variant-numeric:tabular-nums}
table.reg td.cl{min-width:64px;padding:3px}
table.reg tfoot td{background:var(--fila);font-family:"Montserrat",sans-serif;font-weight:800;
  font-size:14px;padding:9px 4px;font-variant-numeric:tabular-nums;border-top:2px solid var(--nit)}
table.reg tfoot td:first-child{text-align:left;padding-left:14px;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}

.marca-b{width:100%;height:34px;border:1.5px solid var(--line);border-radius:3px;background:transparent;
  cursor:pointer;font:inherit;font-family:"Montserrat",sans-serif;font-weight:800;font-size:13px;
  color:var(--line-2);display:flex;align-items:center;justify-content:center;transition:none}
.marca-b:hover{border-color:var(--marca-c);color:var(--marca-c)}
.marca-b[aria-pressed="true"]{background:var(--marca-c);border-color:var(--marca-c);color:#fff}
td.cl.bo{--marca-c:var(--st-si)} td.cl.avis{--marca-c:var(--st-proces)}
td.cl.mal{--marca-c:var(--st-no)} td.cl.info{--marca-c:var(--q2)} td.cl.neutre{--marca-c:var(--muted)}

.validar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:18px}
.validar .nota{font-size:13px;color:var(--muted);max-width:60ch}
.boto.gran{font-size:13.5px;padding:14px 26px}

/* ---------- PÀGINA D'EQUIP ---------- */
.cap-equip{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--verd-clar);
  border-radius:3px;padding:22px 24px;box-shadow:var(--ombra);margin-bottom:26px}
.cap-equip .dades{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end}
.cap-equip .c{display:flex;flex-direction:column;gap:3px}
.cap-equip label{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cap-equip input{font:inherit;font-family:"Montserrat",sans-serif;font-weight:800;border:0;
  border-bottom:1px dashed var(--line-2);background:transparent;color:inherit;padding:2px 3px}
.cap-equip input:hover,.cap-equip input:focus{border-bottom-color:var(--verd-viu)}
.cap-equip input.gran{font-size:26px;letter-spacing:-.02em;min-width:280px}
.cap-equip input.petit{font-size:16px;min-width:130px}
.cap-equip input::placeholder{color:var(--muted);font-weight:600}

.plantilla-t{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;
  background:var(--surface);border:1px solid var(--line);border-radius:3px;box-shadow:var(--ombra);overflow:hidden}
.plantilla-t th,.plantilla-t td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--graella)}
.plantilla-t thead th{background:var(--verd-pregon);color:#fff;font-family:"Montserrat",sans-serif;
  font-weight:700;font-size:10px;letter-spacing:.13em;text-transform:uppercase}
.plantilla-t tbody tr:last-child td{border-bottom:0}
.plantilla-t tbody tr:hover td{background:var(--fila)}
.plantilla-t td.dorsal{width:52px;font-family:"Montserrat",sans-serif;font-weight:800;
  color:var(--muted);font-variant-numeric:tabular-nums}
.plantilla-t td.jug a{font-family:"Montserrat",sans-serif;font-weight:700;font-size:15px;
  color:inherit;text-decoration:none;border-bottom:2px solid var(--verd-clar)}
.plantilla-t td.jug a:hover{border-bottom-color:var(--verd-viu);color:var(--verd-text)}
.plantilla-t td.jug .sense{color:var(--muted);font-weight:600}
.plantilla-t td.n{text-align:center;font-variant-numeric:tabular-nums;font-weight:700;
  font-family:"Montserrat",sans-serif;width:88px}
.plantilla-t td.n small{display:block;font-family:"Archivo",sans-serif;font-weight:400;
  font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.plantilla-t td.acc{text-align:right;white-space:nowrap;width:190px}
.plantilla-t td.acc a.acc-p{background:var(--verd-pregon);border-color:var(--verd-pregon);color:#fff}
.plantilla-t td.acc a.acc-p:hover{background:var(--verd-viu);border-color:var(--verd-viu);color:#fff}
.plantilla-t td.acc a{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  text-decoration:none;color:var(--ink-2);border:1px solid var(--line-2);border-radius:2px;
  padding:5px 9px;margin-left:6px;display:inline-block}
.plantilla-t td.acc a:hover{border-color:var(--verd-viu);color:var(--verd-text)}
.xip{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:2px;
  border:1px solid currentColor}
.xip .llum{width:8px;height:8px;border-radius:50%;background:currentColor}
.xip.no{color:var(--st-no)} .xip.proces{color:var(--st-proces)} .xip.si{color:var(--st-si)}
.xip.cap{color:var(--muted);border-style:dashed}

.pendent{background:var(--avis-fons);border:1px solid color-mix(in srgb,var(--avis) 35%,transparent);
  border-left:4px solid var(--avis);border-radius:3px;padding:16px 18px;margin-top:26px}
.pendent h3{font-family:"Montserrat",sans-serif;font-size:13px;font-weight:700;color:var(--avis);margin-bottom:5px}
.pendent p{font-size:14px;color:var(--ink-2);max-width:72ch}

/* taula d'indicadors de l'equip */
.ind-marc{background:var(--surface);border:1px solid var(--line);border-radius:3px;
  box-shadow:var(--ombra);overflow-x:auto}
table.ind{border-collapse:separate;border-spacing:0;width:100%;min-width:940px;font-size:12.5px}
table.ind th,table.ind td{border-right:1px solid var(--graella);border-bottom:1px solid var(--graella);
  padding:0;text-align:center}
table.ind thead th{background:var(--nit);color:#fff;font-family:"Montserrat",sans-serif;font-weight:700;
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:9px 8px;
  border-right-color:rgba(255,255,255,.16);vertical-align:middle}
table.ind thead th:first-child{text-align:left}
table.ind td.tipus{text-align:left;padding:10px 14px;background:var(--fila);min-width:180px}
table.ind td.tipus b{font-family:"Montserrat",sans-serif;font-weight:700;font-size:14px;display:block}
table.ind td.tipus .comptes{display:flex;gap:6px;margin-top:5px}
table.ind td.tipus .comptes label{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:600;display:flex;align-items:center;gap:4px}
table.ind td.tipus .comptes input{width:46px;font:inherit;font-family:"Montserrat",sans-serif;
  font-weight:700;font-size:12px;text-align:center;border:1px solid var(--line-2);border-radius:2px;
  background:var(--surface);color:inherit;padding:2px 3px;-moz-appearance:textfield}
table.ind .vt{font-family:"Montserrat",sans-serif;font-weight:800;font-size:17px;
  font-variant-numeric:tabular-nums;display:block;padding-top:9px}
table.ind .cel small{display:block;font-size:10px;color:var(--muted);padding-bottom:9px;margin-top:1px}
table.ind td.cel.buida{color:var(--line-2);font-size:16px;font-weight:700}
table.ind td.tipus .marca-d{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:700;border:1px solid var(--line);border-radius:2px;padding:2px 6px}
table.ind input.ic{width:100%;height:44px;font:inherit;font-family:"Montserrat",sans-serif;font-weight:800;
  font-size:15px;text-align:center;border:0;background:transparent;color:var(--ink);
  font-variant-numeric:tabular-nums;-moz-appearance:textfield}
table.ind input::-webkit-outer-spin-button,table.ind input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
table.ind input.ic:focus{outline:2px solid var(--verd-clar);outline-offset:-2px}
table.ind input.ic::placeholder{color:var(--line-2)}
table.ind td.cel{position:relative;min-width:74px}
table.ind td.cel::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--marca-c);opacity:.55}
td.cel.bo{--marca-c:var(--st-si)} td.cel.avis{--marca-c:var(--st-proces)}
td.cel.mal{--marca-c:var(--st-no)} td.cel.info{--marca-c:var(--q2)} td.cel.neutre{--marca-c:var(--line-2)}
.ind-llegenda{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--muted)}
.ind-llegenda i{width:14px;height:3px;display:inline-block;margin-right:6px;vertical-align:3px}

/* semàfor del repte individual */
.semafor{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.semafor button{font:inherit;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;padding:8px 14px;border-radius:2px;border:1.5px solid var(--line-2);
  background:var(--surface);color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.semafor button .llum{width:11px;height:11px;border-radius:50%;background:currentColor;opacity:.32}
.semafor button:hover{border-color:currentColor}
.semafor button[aria-pressed="true"]{color:#fff}
.semafor button[aria-pressed="true"] .llum{opacity:1;background:#fff}
.semafor button.no{color:var(--st-no)}
.semafor button.proces{color:var(--st-proces)}
.semafor button.si{color:var(--st-si)}
.semafor button.no[aria-pressed="true"]{background:var(--st-no);border-color:var(--st-no);color:#fff}
.semafor button.proces[aria-pressed="true"]{background:var(--st-proces);border-color:var(--st-proces);color:#fff}
.semafor button.si[aria-pressed="true"]{background:var(--st-si);border-color:var(--st-si);color:#fff}

/* formalitat destacada dins l'informe */
.form-inf{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:16px}
.form-c{border:1px solid var(--line);border-top:3px solid var(--verd-clar);border-radius:2px;
  padding:12px 14px;background:var(--surface);text-align:center}
.form-c .fe{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
.form-c .fv{font-family:"Montserrat",sans-serif;font-weight:800;font-size:27px;line-height:1.1;
  font-variant-numeric:tabular-nums;margin-top:3px}
.form-c.total{background:var(--verd-pregon);border-color:var(--verd-pregon);border-top-color:var(--nit);color:#fff}
.form-c.total .fe{color:rgba(255,255,255,.75)}

/* gràfic de barres vertical */
.cols{display:flex;align-items:flex-end;justify-content:space-around;gap:10px;height:168px;
  padding:0 4px;border-bottom:1.5px solid var(--line-2);position:relative}
.cols .guia{position:absolute;left:0;right:0;border-top:1px dashed var(--graella);pointer-events:none}
.col{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;
  position:relative;min-width:0}
.col .barra{width:100%;max-width:46px;background:var(--verd-pregon);border-radius:3px 3px 0 0;
  transition:height .45s cubic-bezier(.2,.7,.3,1)}
.col .vc{font-family:"Montserrat",sans-serif;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;
  margin-bottom:4px}
.cols-et{display:flex;justify-content:space-around;gap:10px;padding:7px 4px 0}
.cols-et span{flex:1 1 0;text-align:center;font-size:10.5px;color:var(--ink-2);line-height:1.25;min-width:0}
.eix{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);margin-top:6px}

/* ---------- IMPRESSIÓ ---------- */
@page{size:A4 portrait;margin:11mm}
@media print{
  :root{--ground:#FFF;--surface:#FFF;--ink:#16241A;--ink-2:#3B463E;--muted:#6E7A70;
    --line:#C9D2C6;--line-2:#AEB9AC;--fila:#F2F5F0;--graella:#E3E9E0;--ombra:none}
  html,body{background:#fff!important}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}

  .wrap{max-width:none;padding:0;margin:0}
  .full{border:0;box-shadow:none;border-radius:0;grid-template-columns:42px minmax(0,1fr)}
  .full + .full{margin-top:0}
  .banda span{font-size:14px}
  .cos{padding:0 0 0 15px}
  .titol-informe{font-size:22px;padding-bottom:9px}
  .titol-informe small{margin-top:4px}
  .fila-seccio{margin-top:11px;padding-bottom:6px}
  .etiqueta-seccio{font-size:11px}
  .programa select{font-size:9.5px;padding:3px 7px}
  .qui{font-size:10.5px}
  .identitat{margin-top:11px;grid-template-columns:72px minmax(0,1fr) auto;gap:15px}
  .identitat h2{font-size:25px}
  .foto{width:72px;height:72px;font-size:7.5px}

  .duo{grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
  .trio{grid-template-columns:1fr 1fr 1fr;gap:13px;margin-top:12px}
  .sub{font-size:10px;margin-bottom:7px}
  .llegenda{font-size:9.5px;margin-bottom:7px}
  .grup{gap:6px}
  .grup-fila{font-size:9.5px}
  .pista{height:7px}
  .camp-text,.camp-text.mitja,.camp-text.gran{border:1px solid var(--line);min-height:0;
    font-size:11px;line-height:1.5;padding:8px 10px}
  .camp-text:empty::before{content:""}
  table.detall{font-size:9px}
  table.detall th,table.detall td{padding:2px 5px}
  table.detall caption{font-size:9.5px;padding:8px 0 3px}
  .taules{grid-template-columns:repeat(3,1fr);gap:0 16px}
  .cols{height:118px}
  .col .vc{font-size:11px}
  .cols-et span{font-size:8.5px}
  .form-inf{gap:8px;margin-top:11px}

  .form-c .fv{font-size:19px}
  .semafor{margin-top:8px}
  .semafor button{font-size:8.5px;padding:5px 9px}
  .peu{margin-top:12px;font-size:9px}
  a[href]::after{content:""}
  .salt{break-before:page}
}

<script>
const RUBRICA = {"formalitat":["Assistència","Puntualitat","Roba"],"responsabilitat":["Respecte","Esforç","Autonomia","Lideratge","Transferència"],"blocs":[{"clau":"motrius","titol":"HABILITATS MOTRIUS","items":[{"nom":"Passada","sub":null,"curt":"Passada","nivells":["Li costa passar la pilota amb precisió o potència, fins i tot quan està sol.","Passa bé en exercicis d'entrenament, però al partit perd la pilota o s'equivoca.","Passa amb bona tècnica i precisió al peu del company, però sense buscar superar línies.","Passa la pilota a l'espai o al peu millor orientat per crear un avantatge clar."]},{"nom":"Control","sub":null,"curt":"Control","nivells":["Se li n'escapa la pilota al controlar, inclús si li ve a poc a poc i sol.","Controla bé en estàtic, però al partit se li n'escapa per la pressió o precipitació.","Orienta bé el control per no perdre-la, però sense buscar enganyar ni desbordar el rival.","Controla orientat per superar la pressió o preparar la següent acció amb avantatge."]},{"nom":"Conducció","sub":null,"curt":"Conducció","nivells":["Li costa conduir la pilota sense perdre-la o sense mirar contínuament els peus.","Condueix bé si té espai al davant, però al partit s'embarrona quan li surten rivals.","Condueix amb el cap aixecat i la pilota enganxada, però simplement avança sense atraure rivals.","Condueix amb canvis de ritme, atraient rivals per obrir espais i trobar el company lliure."]},{"nom":"Regat","sub":null,"curt":"Regat","nivells":["No aconsegueix superar cap rival en situacions d'1vs1.","Fa regats en exercicis, però al partit tria malament el moment i perd la pilota.","Supera el rival per velocitat o tècnica quan té espai, però sense elegir moments.","Desborda el rival llegint la seva posició per desequilibrar i crear una superioritat."]},{"nom":"Finalització","sub":null,"curt":"Finalització","nivells":["No aconsegueix xutar a porteria amb força o precisió, ni tan sols quan està sol.","Xuta bé a l'entrenament, però al partit precipita el xut, li surt fluix o fora.","Xuta a porteria amb bona tècnica i força, però al mig o sense buscar els espais buits.","Xuta a porteria buscant conscientment el pal o el buit que deixa el porter per assegurar el gol."]},{"nom":"Perfil","sub":null,"curt":"Perfil","nivells":["Rep d'esquena al camp o mal orientat, sense veure què passa al seu voltant.","Es perfila bé en situacions simples, però al partit necessita tocs de més per veure el camp.","S'orienta bé abans de rebre per veure el camp, però sense aprofitar-ho per accelerar la jugada.","S'orienta perfectament abans de rebre per veure tot el camp i jugar directament a un sol toc."]}]},{"clau":"ambPilota","titol":"MOMENT AMB PILOTA (POSSESSIÓ)","items":[{"nom":"GESTIÓN DEL ESPACIO","sub":"Ofrecer apoyos","curt":"Gestió de l'espai","nivells":["Es queda aturat sense oferir ajuda al company que té la pilota.","Es mou per demanar-la, però no aconsegueix trobar l'espai lliure.","S'ofereix constantment per rebre la pilota i donar opcions de passada.","Llegeix el joc: es mou per rebre lliure de marca o per arrossegar rivals i alliberar un company."]},{"nom":"FINALIZACIÓN","sub":"Decisión y finalización","curt":"Finalització","nivells":["Juga de manera egoista o dubta massa quan ha de decidir.","Intenta fer la passada o xutar, però tria la pitjor opció de la jugada.","Decideix bé: passa la pilota al company millor ubicat o xuta si té avantatge.","Genera gol o opció clara: assisteix al company sol o defineix amb molta solvència."]},{"nom":"GESTIÓN DEL BALÓN","sub":"Ritmo de juego","curt":"Gestió de la pilota","nivells":["Comet errades tècniques greus i perd pilotes fàcils.","Reté massa la pilota o accelera la jugada sense cap necessitat.","Juga ràpid a 1-2 tocs i dona continuïtat a la circulació de l'equip.","Domina el ritme del partit: accelera o frena el joc segons convingui a l'equip."]},{"nom":"COMUNICACIÓN","sub":"Hablar y orientar","curt":"Comunicació","nivells":["Juga en silenci, aïllat i d'esquena al joc.","Demana la pilota const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const CLAU = "fge-avaluacio-v2";

function jugadorBuit(idx){
  return {
    idx, nom: null, periode: "Temporada 2025-26",
    fitxa: {}, textos: {},
    formalitat: Object.fromEntries(RUBRICA.formalitat.map(n => [n, null])),
    respons: RUBRICA.responsabilitat.map(n => ({nom: n, q: [null, null, null]})),
    blocs: RUBRICA.blocs.map(b => ({
      clau: b.clau, titol: b.titol,
      items: b.items.map(it => ({
        nom: it.nom, sub: it.sub, curt: it.curt, nivells: it.nivells,
        q: [null, null, null], obs: [null, null, null]
      }))
    }))
  };
}
function nou(){ return Array.from({length: NJUGADORS}, (_, i) => jugadorBuit(i + 1)); }

function fusiona(desat){
  return nou().map((p, i) => {
    const q = desat[i]; if (!q) return p;
    p.nom = q.nom ?? null;
    p.periode = q.periode || p.periode;
    p.fitxa = q.fitxa || {};
    p.textos = q.textos || {};
    Object.keys(p.formalitat).forEach(k => { if (q.formalitat && q.formalitat[k] != null) p.formalitat[k] = q.formalitat[k]; });
    p.respons.forEach((r, ri) => { const s = q.respons?.[ri]; if (s && Array.isArray(s.q)) r.q = s.q.slice(0, 3); });
    p.blocs.forEach((b, bi) => b.items.forEach((it, ii) => {
      const s = q.blocs?.[bi]?.items?.[ii];
      if (s){ if (Array.isArray(s.q)) it.q = s.q.slice(0, 3); if (Array.isArray(s.obs)) it.obs = s.obs.slice(0, 3); }
    }));
    return p;
  });
}
function carrega(){
  try{
    const cru = localStorage.getItem(CLAU);
    if (!cru) return nou();
    const d = JSON.parse(cru);
    if (Array.isArray(d)) return fusiona(d);
    if (d && Array.isArray(d.jugadors)){
      EQUIP = Object.assign(equipBuit(), d.equip || {});
      REGISTRES = d.registres || {};
      if (d.sessio) SESSIO = Object.assign(SESSIO, d.sessio);
      TIPUS_SESSIO.forEach(([k]) => { EQUIP.indicadors[k] = Object.assign({dies: null, reg: null}, (d.equip?.indicadors || {})[k] || {}); });
      return fusiona(d.jugadors);
    }
    return nou();
  }catch(e){ return nou(); }
}

/* ============ CÀLCULS ============ */
const mitjanaDe = xs => { const v = xs.filter(x => typeof x === "number"); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const mitjanaItem = it => mitjanaDe(it.q);
const mitjanaBloc = b => mitjanaDe(b.items.map(mitjanaItem));
const mitjanaBlocQ = (b, qi) => mitjanaDe(b.items.map(it => it.q[qi]));
const mitjanaRespons = p => mitjanaDe(p.respons.map(r => mitjanaDe(r.q)));
function formalitatTotal(p){
  const v = Object.values(p.formalitat).filter(x => typeof x === "number");
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
function mitjanaGlobal(p){
  return mitjanaDe(p.blocs.map(mitjanaBloc).concat([mitjanaRespons(p)]));
}
function nivell(v){
  if (v === null) return "";
  if (v < 0.5) return "Nivell entreno";
  if (v < 1.5) return "Nivell inicial";
  if (v < 2.5) return "En desenvolupament";
  if (v < 3.5) return "Nivell alt";
  return "Nivell molt alt";
}

const tip = document.getElementById("tip");
function mostraTip(e, html){
  tip.innerHTML = html; tip.style.opacity = "1";
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY - r.height - 10;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y < 8) y = e.clientY + 16;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const amagaTip = () => { tip.style.opacity = "0"; };
document.addEventListener("scroll", amagaTip, true);

function avui(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function dataLlarga(iso){
  if (!iso) return "";
  const [a, m, d] = iso.split("-").map(Number);
  const dies = ["diumenge", "dilluns", "dimarts", "dimecres", "dijous", "divendres", "dissabte"];
  const mesos = ["gener", "febrer", "març", "abril", "maig", "juny", "juliol",
                 "agost", "setembre", "octubre", "novembre", "desembre"];
  const dt = new Date(a, m - 1, d);
  const mes = mesos[m - 1];
  const de = "aeiouàèéíòóú".includes(mes[0]) ? "d'" : "de ";
  return `${dies[dt.getDay()]}, ${d} ${de}${mes} de ${a}`;
}
const clauSessio = () => `${SESSIO.equip}|${SESSIO.data}|${SESSIO.tipus}`;
const parteixClau = c => { const [equip, data, tipus] = c.split("|"); return {equip, data, tipus: tipus || "entrenament"}; };
const nomTipus = t => (TIPUS_SESSIO.find(([k]) => k === t) || [, "Entrenament"])[1];
function registreDe(){
  if (!REGISTRES[clauSessio()]) REGISTRES[clauSessio()] = {};
  return REGISTRES[clauSessio()];
}

/* comptes del registre diari, per jugador, dins el rang de dates de l'equip */
function sessionsFiltrades(tipus){
  return Object.keys(REGISTRES).filter(clau => {
    const {data, tipus: t} = parteixClau(clau);
    if (tipus && t !== tipus) return false;
    if (EQUIP.dataInici && data < EQUIP.dataInici) return false;
    if (EQUIP.dataFi && data > EQUIP.dataFi) return false;
    return true;
  });
}
function resumRegistre(n, tipus){
  const c = Object.fromEntries(INDICADORS.map(([k]) => [k, 0]));
  const claus = sessionsFiltrades(tipus);
  claus.forEach(clau => {
    const r = (REGISTRES[clau] || {})[n];
    if (r) INDICADORS.forEach(([k]) => { if (r[k]) c[k]++; });
  });
  return Object.assign({dies: claus.length}, c);
}
/* totals de l'equip per tipus de sessió, calculats des dels registres */
function totalsEquip(tipus){
  const c = Object.fromEntries(INDICADORS.map(([k]) => [k, 0]));
  const claus = sessionsFiltrades(tipus);
  claus.forEach(clau => {
    const dia = REGISTRES[clau] || {};
    for (let n = 1; n <= NJUGADORS; n++)
      if (dia[n]) INDICADORS.forEach(([k]) => { if (dia[n][k]) c[k]++; });
  });
  return Object.assign({dies: claus.length, reg: claus.length * NJUGADORS}, c);
}

/* ============ GRÀFICS ============ */
/* Cada trimestre porta color I forma de marca: la identitat mai depèn només del color. */
const FORMES = ["cercle", "quadrat", "triangle"];
function marca(x, y, forma, color, r = 4){
  if (forma === "quadrat") return `<rect x="${x-r}" y="${y-r}" width="${2*r}" height="${2*r}" fill="${color}" stroke="var(--surface)" stroke-width="1.5"/>`;
  if (forma === "triangle") return `<polygon points="${x},${y-r-1} ${x+r+1},${y+r} ${x-r-1},${y+r}" fill="${color}" stroke="var(--surface)" stroke-width="1.5"/>`;
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${color}" stroke="var(--surface)" stroke-width="1.5"/>`;
}
function llegendaQ(){
  return `<div class="llegenda">${QS.map((q, i) => {
    const m = {cercle: `<circle cx="6" cy="6" r="4.5" fill="${COLQ[i]}"/>`,
               quadrat: `<rect x="1.5" y="1.5" width="9" height="9" fill="${COLQ[i]}"/>`,
               triangle: `<polygon points="6,1 11,10.5 1,10.5" fill="${COLQ[i]}"/>`}[FORMES[i]];
    return `<span><svg width="12" height="12" aria-hidden="true">${m}</svg>${q}</span>`;
  }).join("")}</div>`;
}

function radar(eixos, series){
  const N = eixos.length, MAX = 4, R = 92, cx = 186, cy = 128;
  const pt = (i, v) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / N, r = R * (v / MAX);
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  };
  let s = `<svg class="radar" viewBox="0 0 372 266" width="100%" role="img"
    aria-label="Perfil de ${esc(eixos.join(", "))}, escala 1 a 4, per trimestre">`;
  for (let k = 1; k <= MAX; k++)
    s += `<polygon points="${Array.from({length: N}, (_, i) => pt(i, k).join(",")).join(" ")}" fill="none" stroke="var(--graella)" stroke-width="1"/>`;
  for (let i = 0; i < N; i++){
    const [x, y] = pt(i, MAX);
    s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--graella)" stroke-width="1"/>`;
  }
  series.forEach((se, si) => {
    if (se.vals.every(v => v == null)) return;
    const vals = se.vals.map(v => v ?? 0);
    s += `<polygon points="${vals.map((v, i) => pt(i, v).join(",")).join(" ")}"
      fill="${se.color}" fill-opacity=".09" stroke="${se.color}" stroke-width="2" stroke-linejoin="round"/>`;
    vals.forEach((v, i) => {
      if (se.vals[i] == null) return;
      const [x, y] = pt(i, v);
      s += `<g data-tip="<b>${esc(eixos[i])}</b><br>${esc(se.nom)} · ${num(v, 0)} de 4">${marca(x, y, FORMES[si], se.color)}</g>`;
    });
  });
  for (let i = 0; i < N; i++){
    const a = -Math.PI / 2 + i * 2 * Math.PI / N;
    const x = cx + (R + 19) * Math.cos(a), y = cy + (R + 19) * Math.sin(a);
    const anc = Math.abs(Math.cos(a)) < .25 ? "middle" : (Math.cos(a) > 0 ? "start" : "end");
    s += `<text x="${x}" y="${y + 3.5}" text-anchor="${anc}" font-size="8.5" letter-spacing=".5"
      fill="var(--muted)" font-weight="600">${esc(eixos[i])}</text>`;
  }
  s += `<text x="${cx - 5}" y="${cy - R + 10}" text-anchor="end" font-size="8" fill="var(--muted)">4</text></svg>`;
  return s;
}

          <div><p class="sub">Valors<em>Valors de club</em></p>${camp(p.idx, "valors", "Com encaixa amb els valors del club.")}</div>
        </div>
      </section>

      <section class="seccio centrat">
        <h3>Valoració final</h3>
        <div style="margin-top:14px">${camp(p.idx, "final", "Descripció del jugador/a i la seva relació amb l'equip, què destaca dins del camp, què se li proposa millorar i el tancament de temporada.", "gran")}</div>
      </section>

      <footer class="peu">
        <span>${NIVELLS.map(n => `${n[0]} ${n[1]}`).join("  ·  ")}</span>
        <span>A destacar (negreta) · A millorar (cursiva) — Pàgina 2 de 2</span>
      </footer>
    </div>
  </div>`;
}


/* ============ EDICIÓ ============ */
function actual(){ return DADES.find(x => x.idx === ACTUAL) || DADES[0]; }

function onEntrada(e){
  const el = e.target;
  const d = el.dataset;
  let p = d.p ? DADES.find(x => x.idx === Number(d.p)) : actual();
  if (!p) return;

  if (d.equip !== undefined){ EQUIP[d.equip] = el.value.trim() || null; return desa(); }
  if (d.ind !== undefined){
    const n = el.value === "" ? null : Math.max(0, Math.round(Number(el.value)));
    EQUIP.indicadors[d.ind][d.camp] = isNaN(n) ? null : n;
    return desa();
  }
  if (d.text !== undefined){ p.textos[d.text] = el.innerText.replace(/ /g, " ").trim(); return desa(); }
  if (d.fitxa !== undefined){ p.fitxa[d.fitxa] = el.value.trim(); return desa(); }
  if (d.nom !== undefined){
    p.nom = el.value.trim() || null;
    const chip = document.querySelector(`.jugadors button[data-jug="${p.idx}"]`);
    if (chip) chip.innerHTML = `<span class="n">${p.idx}</span>${esc(p.nom || "Sense nom")}`;
    return desa();
  }
  if (d.form !== undefined){
    const n = el.value === "" ? null : Math.max(0, Math.min(100, Number(el.value)));
    p.formalitat[d.form] = isNaN(n) ? null : n;
    const t = formalitatTotal(p);
    const cel = document.getElementById("formTotal");
    if (cel) cel.textContent = t === null ? "—" : Math.round(t) + "%";
    return desa();
  }
  if (d.resp !== undefined){
    const r = p.respons[Number(d.resp)];
    r.q[Number(d.q)] = puntuacio(el);
    const cel = document.querySelector(`[data-mitr="${d.resp}"]`);
    if (cel) cel.textContent = num(mitjanaDe(r.q)) || "·";
    refrescaResum(p);
    return desa();
  }
  if (d.b !== undefined){
    const it = p.blocs[Number(d.b)].items[Number(d.i)];
    if (d.obs !== undefined) it.obs[Number(d.q)] = el.value.trim() || null;
    else { it.q[Number(d.q)] = puntuacio(el); refrescaResum(p); }
    return desa();
  }
}
function puntuacio(el){
  const buit = el.value === "";
  el.classList.toggle("buida", buit);
  if (buit) return null;
  const n = Number(el.value);
  return isNaN(n) ? null : n;
}
function refrescaResum(){ /* el resum viu a l'informe; res a refrescar aquí */ }

/* ============ CÒPIES DE SEGURETAT ============ */
const textCopia = () => JSON.stringify({versio: 4, desat: new Date().toISOString(), equip: EQUIP, jugadors: DADES, registres: REGISTRES, sessio: SESSIO}, null, 1);
function obreCopia(){
  const plafo = document.getElementById("plafoCopia");
  plafo.hidden = false;
  const area = document.getElementById("areaCopia");
  area.value = textCopia();
  area.focus(); area.setSelectionRange(0, 0);
  document.getElementById("avisCopia").textContent = "";
}
async function copiaText(){
  const area = document.getElementById("areaCopia"), avis = document.getElementById("avisCopia");
  area.select();
  try{
    if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error("sense API");
    await navigator.clipboard.writeText(area.value);
    avis.textContent = "Copiat. Enganxa-ho en un fitxer de text i desa'l.";
  }catch(e){ avis.textContent = "Prem Cmd+C per copiar el text seleccionat."; }
}
function aplicaCopia(cru, avisId){
  try{
    const d = JSON.parse(cru);
    const j = Array.isArray(d) ? d : d.jugadors;
    if (!Array.isArray(j)) throw new Error("format");
    if (d && d.registres) REGISTRES = d.registres;
    if (d && d.equip){
      EQUIP = Object.assign(equipBuit(), d.equip);
      TIPUS_SESSIO.forEach(([k]) => { EQUIP.indicadors[k] = Object.assign({dies: null, reg: null}, (d.equip.indicadors || {})[k] || {}); });
    }
    DADES = fusiona(j);
    try{ localStorage.setItem(CLAU, JSON.stringify({equip: EQUIP, jugadors: DADES})); }catch(e){}
    pinta();
    const el = document.getElementById(avisId);
    if (el) el.textContent = "Còpia restaurada.";
  }catch(err){
    const el = document.getElementById(avisId);
    if (el) el.textContent = "Això no és una còpia d'aquesta avaluació.";
  }
}
function carregaCopia(fitxer){
  const l = new FileReader();
  l.onload = () => aplicaCopia(l.result, "avisDades");
  l.readAsText(fitxer);
}

/* ============ PDF ============ */
function fesPdf(nom){
  const original = document.title;
  document.title = "Informe FGE" + (nom ? " - " + nom : "");
  addEventListener("afterprint", () => { document.title = original; }, {once: true});
  setTimeout(() => window.print(), 60);
}

/* ============ ROUTER ============ */
function pinta(){
  const h = location.hash || "#/inici";
  const app = document.getElementById("app");
  const mInf = h.match(/^#\/informe\/(\d+)/);
  const mQua = h.match(/^#\/quadre(?:\/(\d+))?/);
  if (mInf) ACTUAL = Number(mInf[1]);
  else if (mQua && mQua[1]) ACTUAL = Number(mQua[1]);
  const vista = mInf ? "informe" : mQua ? "quadre"
    : h.startsWith("#/registre") ? "registre"
    : (h.startsWith("#/resum") || h.startsWith("#/equip")) ? "resum" : "inici";
  app.innerHTML = {
    informe: () => vistaInforme(ACTUAL), quadre: vistaQuadre,
    registre: vistaRegistre, resum: vistaResum, inici: vistaInici
  }[vista]();

  /* a dalt només hi ha el recorregut principal; avaluació i informe s'obren des de cada jugador */
  document.getElementById("nav").innerHTML = vista === "inici" ? "" :
    `<a href="#/inici">Inici</a>` +
    `<a href="#/registre"${vista === "registre" ? ' aria-current="page"' : ""}>Registre</a>` +
    `<a href="#/resum"${vista === "resum" ? ' aria-current="page"' : ""}>Resum</a>`;

  app.querySelectorAll("[data-tip]").forEach(el => {
    el.addEventListener("mouseenter", e => mostraTip(e, el.dataset.tip));
    el.addEventListener("mousemove", e => mostraTip(e, el.dataset.tip));
    el.addEventListener("mouseleave", amagaTip);
  });
  app.querySelectorAll(".jugadors button").forEach(b => b.addEventListener("click", () => {
    ACTUAL = Number(b.dataset.jug); pinta();
  }));
  app.querySelectorAll(".semafor button").forEach(b => b.addEventListener("click", () => {
    const p = actual();
    p.textos.repteEstat = p.textos.repteEstat === b.dataset.estat ? "" : b.dataset.estat;
    app.querySelectorAll(".semafor button").forEach(o =>
      o.setAttribute("aria-pressed", String(o.dataset.estat === p.textos.repteEstat)));
    desa();
  }));

  const fe = document.getElementById("formEntrar");
  if (fe) fe.addEventListener("submit", ev => {
    ev.preventDefault();
    SESSIO.equip = document.getElementById("in-equip").value;
    SESSIO.tipus = document.getElementById("in-tipus").value;
    SESSIO.data = document.getElementById("in-data").value || avui();
    desa();
    location.hash = "#/registre";
    if (!location.hash.startsWith("#/registre")) pinta();
  });
  app.querySelectorAll(".marca-b").forEach(b => b.addEventListener("click", () => {
    const reg = registreDe(), n = b.dataset.reg, k = b.dataset.item;
    if (!reg[n]) reg[n] = {};
    reg[n][k] = !reg[n][k];
    b.setAttribute("aria-pressed", String(reg[n][k]));
    b.textContent = reg[n][k] ? "✓" : "";
    const cel = document.querySelector(`[data-tot="${k}"]`);
    if (cel) cel.textContent = Array.from({length: NJUGADORS}, (_, i) => reg[i + 1] && reg[i + 1][k]).filter(Boolean).length;
    desa();
  }));

  const bv = document.getElementById("validar");
  if (bv) bv.addEventListener("click", () => { desa(); location.hash = "#/resum"; });

  const q = id => document.getElementById(id);
  if (q("fesPdf")) q("fesPdf").addEventListener("click", () => fesPdf(actual().nom));
  if (q("obreCopia")) q("obreCopia").addEventListener("click", obreCopia);
  if (q("copiaText")) q("copiaText").addEventListener("click", copiaText);
  if (q("restauraText")) q("restauraText").addEventListener("click", () => aplicaCopia(q("areaCopia").value, "avisCopia"));
  if (q("tancaCopia")) q("tancaCopia").addEventListener("click", () => { q("plafoCopia").hidden = true; });
  if (q("pujaDades")) q("pujaDades").addEventListener("change", e => { if (e.target.files[0]) carregaCopia(e.target.files[0]); });
  if (q("buida")) q("buida").addEventListener("click", () => {
    const p = actual();
    if (!confirm(`Segur que vols esborrar les dades de ${p.nom || "aquest jugador"}? No es pot desfer.`)) return;
    DADES[DADES.indexOf(p)] = jugadorBuit(p.idx);
    desa(); pinta();
  });

  scrollTo(0, 0);
}
document.addEventListener("input", onEntrada);
document.addEventListener("change", onEntrada);
addEventListener("hashchange", pinta);
pinta();
</script>
